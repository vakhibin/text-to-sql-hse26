x-common-env: &common-env
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  GENERATOR_MODEL_PRIMARY: ${GENERATOR_MODEL_PRIMARY:-google/gemma-4-26b-a4b-it}
  GENERATOR_MODEL_SECONDARY: ${GENERATOR_MODEL_SECONDARY:-qwen/qwen3.5-35b-a3b}
  QUERY_SKETCHER_MODEL: ${QUERY_SKETCHER_MODEL:-google/gemini-2.5-pro}
  REFINER_MODEL: ${REFINER_MODEL:-google/gemma-4-31b-it}
  JUDGE_MODEL: ${JUDGE_MODEL:-openai/gpt-4.1}
  EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-openai/text-embedding-3-large}
  # Langfuse is bundled into this compose stack (see langfuse-* services
  # below). Defaults point to the in-network web container and the dev
  # project keys provisioned via LANGFUSE_INIT_* on first start.
  LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-true}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-text-to-sql-dev}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-text-to-sql-dev}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}

# ---------------------------------------------------------------------------
# Langfuse self-hosted v3 stack
# ---------------------------------------------------------------------------
#
# All credentials below are local-dev defaults. They MUST be rotated before
# any non-local deployment. We pin Langfuse to the v3 line so it stays
# compatible with the langfuse>=4 Python SDK we use.
x-langfuse-shared-env: &langfuse-shared-env
  DATABASE_URL: postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD:-postgres}@langfuse-postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT:-local-dev-salt-not-for-prod}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  TELEMETRY_ENABLED: ${LANGFUSE_TELEMETRY_ENABLED:-false}
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: ${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-false}
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-clickhouse}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:-miniosecret}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:-miniosecret}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-langfuselocaldev}

services:
  text-to-sql-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: text-to-sql-hse26:latest
    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - services.text_to_sql_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    environment:
      <<: *common-env
      SPIDER_ROOT: /app/databases/spider
      BIRD_ROOT: /app/databases/bird
      BIRD_MINI_ROOT: /app/databases/bird_mini
      CHROMA_PERSIST_DIRECTORY: /app/.cache/chroma
    ports:
      - "8001:8001"
    volumes:
      - ./databases:/app/databases:ro
      - ./.cache:/app/.cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  orchestrator-api:
    image: text-to-sql-hse26:latest
    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - services.orchestrator_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8002"
    environment:
      <<: *common-env
      TEXT_TO_SQL_API_URL: http://text-to-sql-api:8001
      TEXT_TO_SQL_API_TIMEOUT_S: "180"
      ORCH_SQLITE_PATH: /app/.cache/orchestrator/sessions.sqlite
      ORCH_AUDIT_LOG_PATH: /app/.cache/orchestrator/writes.jsonl
      CHROMA_PERSIST_DIRECTORY: /app/.cache/chroma
    ports:
      - "8002:8002"
    volumes:
      - ./.cache:/app/.cache
    depends_on:
      text-to-sql-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ui:
    image: text-to-sql-hse26:latest
    command:
      - uv
      - run
      - --no-sync
      - streamlit
      - run
      - services/ui/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      ORCHESTRATOR_API_URL: http://orchestrator-api:8002
      ORCHESTRATOR_UI_TIMEOUT_S: ${ORCHESTRATOR_UI_TIMEOUT_S:-300}
      TEXT_TO_SQL_API_URL: http://text-to-sql-api:8001
      # Used by the UI to build "Open Langfuse trace" links from the
      # browser. This must be the host-reachable URL, not the internal
      # docker DNS name.
      LANGFUSE_PUBLIC_HOST: ${LANGFUSE_PUBLIC_HOST:-http://localhost:3000}
    ports:
      - "8501:8501"
    volumes:
      - ./.cache:/app/.cache
    depends_on:
      text-to-sql-api:
        condition: service_healthy
      orchestrator-api:
        condition: service_healthy

  # ---- Langfuse self-hosted (v3) ------------------------------------------

  langfuse-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-clickhouse}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server

  langfuse-minio:
    image: minio/minio:latest
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD:-miniosecret}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    volumes:
      - langfuse_minio_data:/data

  langfuse-redis:
    image: redis:7
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${LANGFUSE_REDIS_AUTH:-langfuselocaldev}
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - langfuse_redis_data:/data

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    environment:
      <<: *langfuse-shared-env
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy

  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    environment:
      <<: *langfuse-shared-env
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-local-dev-nextauth-secret-not-for-prod}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-text-to-sql}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-text-to-sql}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-text-to-sql-dev}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-text-to-sql-dev}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-text-to-sql-dev}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-text-to-sql-dev}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-dev@local.dev}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-dev}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-changemechangeme}
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://localhost:3000/api/public/health
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  langfuse_postgres_data:
    driver: local
  langfuse_clickhouse_data:
    driver: local
  langfuse_clickhouse_logs:
    driver: local
  langfuse_minio_data:
    driver: local
  langfuse_redis_data:
    driver: local
